services:
  mongo:
    image: mongo:6
    container_name: mongo-franchise
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  franchise-api:
    build: .
    container_name: franchise-api
    ports:
      - "8081:8080"
    depends_on:
      - mongo
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/franchise_db

volumes:
  mongo_data: